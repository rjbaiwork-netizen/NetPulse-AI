name: Live Backend Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netpulse-backend-live
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./netpulse-live.db
      NETPULSE_ENCRYPTION_KEY: ${{ secrets.NETPULSE_ENCRYPTION_KEY }}
      NETPULSE_JWT_SECRET: ${{ secrets.NETPULSE_JWT_SECRET }}
      NETPULSE_ADMIN_USERNAME: ${{ secrets.NETPULSE_ADMIN_USERNAME }}
      NETPULSE_ADMIN_PASSWORD_HASH: ${{ secrets.NETPULSE_ADMIN_PASSWORD_HASH }}
      NETPULSE_CORS_ORIGINS: https://rjbaiwork-netizen.github.io
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: pip install -r requirements.txt

      - name: Prepare database
        run: alembic -c ../alembic.ini upgrade head

      - name: Start FastAPI
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/netpulse-backend.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 2
          done

      - name: Install ngrok
        working-directory: .
        run: |
          curl -fsSL https://bin.ngrok.com/c/bNyj1mQV4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
          sudo mv ngrok /usr/local/bin/ngrok
          ngrok version

      - name: Start public backend endpoint
        run: |
          test -n "$NGROK_AUTHTOKEN"
          test -n "$NGROK_DOMAIN"
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          echo "NetPulse backend: https://$NGROK_DOMAIN"
          ngrok http 8000 --url "https://$NGROK_DOMAIN"
