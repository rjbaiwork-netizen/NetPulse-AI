name: NetPulse-AI Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: netpulse-production
  cancel-in-progress: false

jobs:
  backend:
    name: FastAPI - GitHub Actions Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./netpulse-live.db
      NETPULSE_ENCRYPTION_KEY: ${{ secrets.NETPULSE_ENCRYPTION_KEY }}
      NETPULSE_JWT_SECRET: ${{ secrets.NETPULSE_JWT_SECRET }}
      NETPULSE_ADMIN_USERNAME: ${{ secrets.NETPULSE_ADMIN_USERNAME }}
      NETPULSE_ADMIN_PASSWORD_HASH: ${{ secrets.NETPULSE_ADMIN_PASSWORD_HASH }}
      NETPULSE_CORS_ORIGINS: ${{ vars.NETPULSE_CORS_ORIGINS || 'https://rjbaiwork-netizen.github.io,http://localhost:3000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Database migration
        run: alembic -c ../alembic.ini upgrade head

      - name: Build production backend image
        working-directory: .
        run: docker build -t netpulse-ai-backend:ci ./backend

      - name: Run production container and verify health
        working-directory: .
        run: |
          docker run -d --name netpulse-ai-backend-ci -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./netpulse-ci.db \
            -e NETPULSE_ENCRYPTION_KEY=ci-only-encryption-key \
            -e NETPULSE_JWT_SECRET=ci-only-jwt-secret \
            -e NETPULSE_ADMIN_USERNAME=ci-admin \
            -e NETPULSE_ADMIN_PASSWORD_HASH='$2b$12$C6UzMDM.H6dfI/f/IKcEe.' \
            -e NETPULSE_CORS_ORIGINS=http://localhost:3000 \
            netpulse-ai-backend:ci
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker rm -f netpulse-ai-backend-ci
              exit 0
            fi
            sleep 2
          done
          docker logs netpulse-ai-backend-ci
          docker rm -f netpulse-ai-backend-ci
          exit 1

  frontend:
    name: Next.js - Build and GitHub Pages Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Configure frontend API base URL
        env:
          NETPULSE_API_BASE_URL: ${{ vars.NETPULSE_API_BASE_URL }}
        run: |
          if [ -n "$NETPULSE_API_BASE_URL" ]; then
            case "$NETPULSE_API_BASE_URL" in
              http://*|https://*) echo "NEXT_PUBLIC_API_BASE_URL=$NETPULSE_API_BASE_URL" >> "$GITHUB_ENV" ;;
              *) echo "NETPULSE_API_BASE_URL must start with http:// or https://"; exit 1 ;;
            esac
          else
            echo "No build-time backend URL configured; the login screen will accept a runtime Codespaces URL."
          fi

      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Verify static export
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/login/index.html
          test -f out/dashboard/index.html
          test -f out/devices/index.html
          test -f out/map/index.html
          test -f out/ai-noc/index.html
          test -f out/customers/index.html
          test -f out/customers/profile/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages site
        working-directory: .
        run: |
          test -n "${{ steps.deployment.outputs.page_url }}"
          for i in {1..30}; do
            if curl --fail --silent --show-error --location "${{ steps.deployment.outputs.page_url }}"; then
              echo
              echo "GitHub Pages deployment is reachable."
              exit 0
            fi
            sleep 2
          done
          exit 1
