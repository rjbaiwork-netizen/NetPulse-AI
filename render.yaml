services:
  - type: web
    name: netpulse-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netpulse-postgres
          property: connectionString
      - key: NETPULSE_ENCRYPTION_KEY
        generateValue: true
      - key: NETPULSE_JWT_SECRET
        generateValue: true
      - key: NETPULSE_ADMIN_USERNAME
        sync: false
      - key: NETPULSE_ADMIN_PASSWORD_HASH
        sync: false
      - key: NETPULSE_CORS_ORIGINS
        value: https://rjbaiwork-netizen.github.io

databases:
  - name: netpulse-postgres
    plan: free
    databaseName: netpulse
    user: netpulse
